<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطعم سين - SEEN</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Aref+Ruqaa:wght@400;700&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="main-page" class="page active">
        <div class="hero-banner">
            <div class="hero-content">
                <div class="logo-container"><img src="logo.png" alt="SEEN" onerror="this.src='https://dummyimage.com/150x150/000/f39c12&text=SEEN';"></div>
                <h2>طعم الأصالة .. بنكهة لا تقاوم</h2>
                <p>مطعم سين / SEEN SIRT</p>
                <div class="contact-bar">
                    <div class="contact-item">
                        <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                        <span class="contact-label">الهاتف:</span><span id="header-phone">جاري التحميل...</span>
                    </div>
                    <div class="contact-divider"></div>
                    <div class="contact-item">
                        <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                        <span class="contact-label">العنوان:</span><span id="header-address">جاري التحميل...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- شريط إعلان الإغلاق -->
        <div id="maintenanceBanner" style="display:none; background:#c0392b; color:white; text-align:center; padding:12px; font-weight:bold; box-shadow:0 0 15px #e74c3c;">
            🚨 <span id="announcementText"></span> 🚨
        </div>

        <div class="main-sections">
            <div class="section-card" onclick="navigateTo('food-page')">
                <div class="real-image-icon"><img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=200&h=200&fit=crop"></div>
                <div class="section-title">قسم الطعام</div><div class="section-subtitle">طلبك لبيتك</div>
            </div>
            <div class="section-card" onclick="navigateTo('offers-page')">
                <div class="real-image-icon"><img src="https://images.unsplash.com/photo-1549465220-1a8b9238cd48?w=200&h=200&fit=crop"></div>
                <div class="section-title">قسم العروض</div>
            </div>
            <div class="section-card" onclick="navigateTo('competitions-page')">
                <div class="real-image-icon">
                    <div class="award-bg"></div>
                    <svg class="award-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <defs><linearGradient id="goldMain" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFF8DC" /><stop offset="30%" stop-color="#FFD700" /><stop offset="60%" stop-color="#DAA520" /><stop offset="100%" stop-color="#8B6508" /></linearGradient><linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8B6508" /><stop offset="100%" stop-color="#4a3500" /></linearGradient><path id="textArc" d="M 15 50 A 35 35 0 0 1 85 50" fill="transparent" /></defs>
                        <text font-family="'Cinzel', serif" font-size="10" font-weight="900" fill="#FFD700" stroke="#1a1a1a" stroke-width="0.5" paint-order="stroke fill"><textPath href="#textArc" startOffset="50%" text-anchor="middle">WIN WITH US</textPath></text>
                        <g transform="translate(50, 55) scale(0.5)"><path d="M 0 -45 L 11 -16 L 42 -16 L 17 4 L 26 36 L 0 18 L -26 36 L -17 4 L -42 -16 L -11 -16 Z" fill="url(#goldDark)" transform="translate(3, 5)" /><path d="M 0 -45 L 11 -16 L 42 -16 L 17 4 L 26 36 L 0 18 L -26 36 L -17 4 L -42 -16 L -11 -16 Z" fill="url(#goldMain)" stroke="#FFF8DC" stroke-width="2" stroke-linejoin="miter"/><text x="0" y="15" font-family="'Cairo', sans-serif" font-size="40" font-weight="900" fill="#FFFFFF" text-anchor="middle" filter="drop-shadow(0px 3px 2px rgba(0,0,0,0.9))">1</text></g>
                    </svg>
                </div>
                <div class="section-title">المسابقات</div>
            </div>
        </div>
    </div>

    <!-- صفحة الطعام -->
    <div id="food-page" class="page">
        <div class="page-header">
            <button class="back-btn" onclick="navigateTo('main-page')">&#8594;</button><div class="page-title">قائمة الطعام</div>
        </div>
        <div class="accordion-container" id="customer-menu-container">
            <!-- سيتم تعبئتها ديناميكياً من API -->
        </div>
    </div>

    <!-- صفحة العروض -->
    <div id="offers-page" class="page">
        <div class="page-header"><button class="back-btn" onclick="navigateTo('main-page')">&#8594;</button><div class="page-title">العروض</div></div>
        <div id="customer-offers-container" style="padding: 20px;"></div>
    </div>

    <!-- صفحة المسابقات -->
    <div id="competitions-page" class="page">
        <div class="page-header"><button class="back-btn" onclick="navigateTo('main-page')">&#8594;</button><div class="page-title">المسابقات</div></div>
        <div id="customer-comp-container" style="padding: 20px;"></div>
    </div>

    <!-- شريط السلة السفلي -->
    <div id="cart-bar" style="display:none; position:fixed; bottom:0; left:0; right:0; background:#1a1a1a; border-top:2px solid #f39c12; padding:15px; z-index:1000; justify-content:space-between; align-items:center;">
        <div style="color:#fff; font-weight:bold;"><span id="cart-count">0</span> أصناف | <span id="cart-total">0</span> د.ل</div>
        <button onclick="openCart()" style="background:#f39c12; color:#000; border:none; padding:8px 16px; border-radius:8px; font-weight:bold; cursor:pointer;">عرض السلة 🛒</button>
    </div>

    <!-- نافذة السلة (Modal) -->
    <div id="cart-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:2000; justify-content:center; align-items:center; padding:15px;">
        <div style="background:#1a1a1a; width:100%; max-width:400px; border-radius:16px; padding:20px; position:relative;">
            <span onclick="closeCart()" style="position:absolute; top:10px; left:15px; font-size:28px; cursor:pointer; color:#777;">&times;</span>
            <h2 style="color:#f39c12; text-align:center; margin-bottom:15px;">سلة الطلبات</h2>
            <div id="cart-items" style="margin-bottom:15px; max-height:200px; overflow-y:auto;"></div>
            <div style="border-top:1px solid #333; padding-top:10px; margin-bottom:15px; text-align:left; color:#fff; font-size:18px;">المجموع: <span id="modal-total">0</span> د.ل</div>
            <input type="text" id="customer-name" placeholder="الاسم الثلاثي" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:1px solid #333; background:#222; color:#fff;">
            <input type="tel" id="customer-phone" placeholder="رقم الهاتف" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:1px solid #333; background:#222; color:#fff;">
            <textarea id="order-notes" placeholder="ملاحظات إضافية (بدون بصل...)" rows="2" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:1px solid #333; background:#222; color:#fff;"></textarea>
            <button onclick="sendWhatsAppOrder()" style="width:100%; background:#25D366; color:#fff; border:none; padding:14px; border-radius:8px; font-size:16px; font-weight:bold; cursor:pointer;">تأكيد الطلب عبر واتساب</button>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
